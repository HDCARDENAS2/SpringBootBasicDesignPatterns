server.servlet.context-path=/api
server.port=8081
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.mapping-resources[0]=queries.xml
spring.jpa.open-in-view=false
spring.activemq.broker-url=vm://localhost?
broker.persistent=false
spring.activemq.in-memory=true
customdata.email.endpoint=http://localhost:8082
customdata.email.salesTeam=salesteam@test.com
customdata.jms.topic=brokerTestJMS
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=###########@gmail.com
spring.mail.password=#############
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true